<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MediaKing</title>
<style>
  :root {
    --bg: #101820; --surface: #16222c; --surface2: #243642; --text: #eef3f7; --muted: #a9bdca;
    --accent: #ff8a65; --ok: #5bd18b; --warn: #ffc857; --err: #ff6b6b; --radius: 12px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { padding: 16px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--surface2); }
  header .logo { width: 36px; height: 36px; display: block; }
  header h1 { font-size: 18px; margin: 0; }
  header .device { color: var(--muted); font-size: 13px; margin-left: auto; text-align: right; }
  main { max-width: 900px; margin: 0 auto; padding: 16px; display: grid; gap: 16px; }
  section { background: var(--surface); border-radius: var(--radius); padding: 16px; }
  h2 { font-size: 15px; margin: 0 0 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  button, .button { font: inherit; border: 0; border-radius: 999px; padding: 9px 16px; background: var(--surface2); color: var(--text); cursor: pointer; }
  button.primary, .button.primary { background: var(--accent); color: #101820; font-weight: 600; }
  button:disabled { opacity: .5; cursor: default; }
  button.small { padding: 4px 12px; font-size: 13px; }
  button.danger { background: transparent; color: var(--err); border: 1px solid color-mix(in srgb, var(--err) 45%, transparent); }
  button.danger:hover { background: color-mix(in srgb, var(--err) 15%, transparent); }
  input[type=text] { font: inherit; width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--surface2); background: var(--bg); color: var(--text); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .muted { color: var(--muted); }
  .error { color: var(--err); }
  .hidden { display: none !important; }
  .roots { display: flex; gap: 8px; flex-wrap: wrap; }
  .root { text-align: left; border-radius: 10px; padding: 10px 14px; background: var(--surface2); }
  .root.active { outline: 2px solid var(--accent); }
  .root small { display: block; color: var(--muted); font-size: 12px; }
  .crumbs { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; margin-bottom: 8px; }
  .crumbs button { background: none; padding: 2px 6px; color: var(--accent); }
  .list { list-style: none; margin: 0; padding: 0; }
  .list li { display: flex; gap: 10px; align-items: center; padding: 8px 6px; border-radius: 8px; }
  .list li.dir { cursor: pointer; }
  .list li.dir:hover { background: var(--surface2); }
  .list .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .list .size { color: var(--muted); font-size: 13px; white-space: nowrap; }
  .drop { border: 2px dashed var(--surface2); border-radius: var(--radius); padding: 24px; text-align: center; color: var(--muted); }
  .drop.over { border-color: var(--accent); color: var(--text); }
  .item { padding: 10px 0; border-bottom: 1px solid var(--surface2); }
  .item:last-child { border-bottom: 0; }
  .item .top { display: flex; gap: 8px; align-items: center; }
  .item .title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar { height: 6px; background: var(--surface2); border-radius: 3px; overflow: hidden; margin: 6px 0 4px; }
  .bar > div { height: 100%; width: 0; background: var(--accent); transition: width .3s; }
  .item.done .bar > div { background: var(--ok); }
  .item.failed .bar > div { background: var(--err); }
  .meta { font-size: 13px; color: var(--muted); }
  .pair { max-width: 420px; margin: 40px auto; display: grid; gap: 12px; }
  .remote { display: grid; gap: 12px; }
  .pad { display: grid; grid-template-columns: repeat(3, 64px); grid-template-rows: repeat(3, 64px); gap: 8px; justify-content: center; }
  .pad button, .keys button { font-size: 20px; padding: 0; }
  .pad button { border-radius: 16px; }
  .pad .ok { background: var(--accent); color: #101820; font-weight: 700; font-size: 16px; }
  .keys { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .keys button { min-width: 64px; height: 44px; }
  .now { text-align: center; }
  .now b { display: block; }
  .pair input { font-size: 22px; letter-spacing: .15em; text-transform: uppercase; text-align: center; }
</style>
</head>
<body>
<header>
  <svg class="logo" viewBox="0 0 108 108" aria-hidden="true"><rect width="108" height="108" rx="24" fill="#16222c"/><path fill="#ff8a65" d="M24,74 L19,38 L38,53 L54,29 L70,53 L89,38 L84,74 Z"/><circle cx="19" cy="36" r="5" fill="#ff8a65"/><circle cx="54" cy="27" r="5" fill="#ff8a65"/><circle cx="89" cy="36" r="5" fill="#ff8a65"/><rect x="24" y="78" width="60" height="7" rx="3.5" fill="#ff8a65"/><path fill="#16222c" d="M48,52 L48,70 L64,61 Z"/></svg>
  <h1>Media<span style="color:var(--accent)">King</span> – <span data-t="upload"></span></h1>
  <div class="device" id="device"></div>
</header>

<main>
  <section id="pairing" class="pair hidden">
    <h2 data-t="pairing"></h2>
    <p class="muted" data-t="pairingHelp"></p>
    <input id="codeInput" type="text" autocomplete="off" placeholder="XXXX-XXXX" maxlength="9">
    <button class="primary" id="codeButton" data-t="connect"></button>
    <p class="error" id="pairError"></p>
  </section>

  <div id="app" class="hidden" style="display:grid;gap:16px">
    <section class="remote">
      <h2 data-t="remote"></h2>
      <div class="now muted" id="nowPlaying"></div>
      <div class="row">
        <input type="text" id="remoteSearch" data-t-placeholder="remoteSearchHint" autocomplete="off" style="flex:1;min-width:180px">
        <button class="primary" id="remoteSearchButton" data-t="search"></button>
      </div>
      <div class="pad">
        <span></span><button data-key="up" aria-label="▲">▲</button><span></span>
        <button data-key="left" aria-label="◀">◀</button><button class="ok" data-key="ok">OK</button><button data-key="right" aria-label="▶">▶</button>
        <span></span><button data-key="down" aria-label="▼">▼</button><span></span>
      </div>
      <div class="keys">
        <button data-key="back" data-t-title="back">↩</button>
        <button data-key="rewind" data-t-title="rewind">⏪</button>
        <button data-key="play_pause" data-t-title="playPause">⏯</button>
        <button data-key="forward" data-t-title="forward">⏩</button>
        <button data-key="subtitles" data-t-title="subtitles">CC</button>
        <button data-key="menu" data-t-title="menu">⚙</button>
      </div>
      <p class="muted" style="font-size:13px;margin:0" data-t="remoteTip"></p>
      <p class="error" id="remoteError" style="margin:0"></p>
    </section>

    <section>
      <h2 data-t="where"></h2>
      <div class="roots" id="roots"></div>
    </section>

    <section>
      <div class="crumbs" id="crumbs"></div>
      <div class="row" style="margin-bottom:8px">
        <span class="muted" id="free"></span>
        <span style="flex:1"></span>
        <button class="small" id="mkdirButton" data-t="newFolder"></button>
      </div>
      <ul class="list" id="listing"></ul>
    </section>

    <section>
      <h2><span data-t="uploadTo"></span> <span id="targetName" style="text-transform:none;color:var(--text)"></span></h2>
      <div class="drop" id="drop">
        <p data-t="dropHere"></p>
        <div class="row" style="justify-content:center">
          <label class="button primary"><span data-t="chooseFiles"></span><input type="file" id="fileInput" multiple hidden></label>
          <label class="button"><span data-t="wholeFolder"></span><input type="file" id="folderInput" webkitdirectory multiple hidden></label>
        </div>
      </div>
      <p class="muted" style="font-size:13px" data-t="uploadTip"></p>
    </section>

    <section>
      <h2 data-t="addons"></h2>
      <p class="muted" style="margin-top:0" data-t-html="addonsHelp"></p>
      <ul class="list" id="addonList"></ul>
      <div class="row" style="margin-top:12px">
        <label class="button primary"><span data-t="installAddonFile"></span><input type="file" id="addonFile" accept=".json,application/json" hidden></label>
      </div>
      <div class="row" style="margin-top:8px">
        <input type="text" id="addonUrl" placeholder="https://…/addon.json" style="flex:1;min-width:200px">
        <button id="addonUrlButton" data-t="installFromUrl"></button>
      </div>
      <p class="error" id="addonError"></p>
    </section>

    <section>
      <h2 data-t="tmdbTitle"></h2>
      <p class="muted" style="margin-top:0" data-t-html="tmdbHelp"></p>
      <p id="tmdbStatus"></p>
      <div class="row">
        <input type="password" id="tmdbToken" placeholder="API Read Access Token" autocomplete="off" style="flex:1;min-width:200px">
        <button id="tmdbSave" data-t="save"></button>
        <button id="tmdbClear" class="danger hidden" data-t="delete"></button>
      </div>
      <p class="error" id="tmdbError"></p>
    </section>

    <section>
      <h2 data-t="subsTitle"></h2>
      <p class="muted" style="margin-top:0" data-t-html="subsHelp"></p>
      <p id="subsStatus"></p>
      <div class="row">
        <input type="password" id="subsKey" placeholder="API key" autocomplete="off" style="flex:1;min-width:200px">
      </div>
      <div class="row" style="margin-top:8px">
        <input type="text" id="subsUser" data-t-placeholder="subsUser" autocomplete="off" style="flex:1;min-width:160px">
        <input type="password" id="subsPassword" data-t-placeholder="netPassword" autocomplete="new-password" style="flex:1;min-width:140px">
        <button id="subsSave" data-t="save"></button>
        <button id="subsClear" class="danger hidden" data-t="delete"></button>
      </div>
      <p class="error" id="subsError"></p>
    </section>

    <section>
      <h2 data-t="networkTitle"></h2>
      <p class="muted" style="margin-top:0" data-t="networkHelp"></p>
      <ul class="list" id="networkList"></ul>
      <div class="row" style="margin-top:12px">
        <input type="text" id="netHost" data-t-placeholder="netHost" style="flex:1;min-width:180px">
        <input type="text" id="netShare" data-t-placeholder="netShare" style="flex:1;min-width:140px">
        <input type="text" id="netPath" data-t-placeholder="netPath" style="flex:1;min-width:140px">
      </div>
      <div class="row" style="margin-top:8px">
        <input type="text" id="netUser" data-t-placeholder="netUser" autocomplete="off" style="flex:1;min-width:180px">
        <input type="password" id="netPassword" data-t-placeholder="netPassword" autocomplete="new-password" style="flex:1;min-width:140px">
        <button id="netAdd" class="primary" data-t="addToLibrary"></button>
      </div>
      <p class="muted" style="font-size:13px" data-t="netWindowsTip"></p>
      <p class="error" id="netError"></p>
    </section>

    <section id="queueSection" class="hidden">
      <div class="row" style="margin-bottom:4px">
        <h2 style="margin:0" data-t="queue"></h2>
        <span style="flex:1"></span>
        <span class="muted" id="queueSummary"></span>
        <button class="small" id="clearDone" data-t="clearDone"></button>
      </div>
      <div id="queue"></div>
    </section>
  </div>
</main>

const LANG = TEXTS[document.documentElement.lang] ? document.documentElement.lang : "hu";
const LOCALE = { hu: "hu-HU", en: "en-US", de: "de-DE" }[LANG];

/** The text for [key] in the page's language, with {0}, {1}… filled in. */
function t(key, ...args) {
  const text = TEXTS[LANG][key] ?? TEXTS.hu[key] ?? key;
  return text.replace(/\{(\d+)\}/g, (_, i) => String(args[i]));
}

for (const node of document.querySelectorAll("[data-t]")) node.textContent = t(node.dataset.t);
// Only our own constant texts, which carry a little markup (<code>, <b>).
for (const node of document.querySelectorAll("[data-t-html]")) node.innerHTML = t(node.dataset.tHtml);
for (const node of document.querySelectorAll("[data-t-placeholder]")) node.placeholder = t(node.dataset.tPlaceholder);
for (const node of document.querySelectorAll("[data-t-title]")) node.title = t(node.dataset.tTitle);
document.title = "MediaKing – " + t("upload");

let code = localStorage.getItem("pairingCode") || "";
let roots = [];
let current = null; // { root, path }
const queue = [];
let running = false;

// --- tiny DOM helper: text only, never innerHTML, so file names cannot inject markup ---
function el(tag, props = {}, ...children) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(props)) {
    if (key === "class") node.className = value;
    else if (key.startsWith("on")) node.addEventListener(key.slice(2), value);
    else node.setAttribute(key, value);
  }
  for (const child of children.flat()) {
    if (child == null) continue;
    node.append(child instanceof Node ? child : document.createTextNode(String(child)));
  }
  return node;
}

function formatBytes(bytes) {
  if (bytes < 1024) return bytes + " B";
  const units = ["KB", "MB", "GB", "TB"];
  let value = bytes / 1024, unit = 0;
  while (value >= 1024 && unit < units.length - 1) { value /= 1024; unit++; }
  return value.toLocaleString(LOCALE, { maximumFractionDigits: value >= 100 ? 0 : 1 }) + " " + units[unit];
}

function formatEta(seconds) {
  if (!isFinite(seconds) || seconds <= 0) return "";
  if (seconds >= 3600) return t("hm", Math.floor(seconds / 3600), Math.floor(seconds % 3600 / 60));
  if (seconds >= 60) return t("m", Math.floor(seconds / 60));
  return t("s", Math.ceil(seconds));
}

const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
const query = (params) => new URLSearchParams(params).toString();

// --- pairing ---
(function takeCodeFromUrl() {
  const match = location.hash.match(/code=([A-Za-z0-9-]+)/);
  if (match) {
    code = match[1];
    localStorage.setItem("pairingCode", code);
    history.replaceState(null, "", location.pathname);
  }
})();

function showPairing(message) {
  $("app").classList.add("hidden");
  $("pairing").classList.remove("hidden");
  $("pairError").textContent = message || "";
  $("codeInput").focus();
}

$("codeButton").addEventListener("click", () => {
  code = $("codeInput").value.trim();
  localStorage.setItem("pairingCode", code);
  start();
});
$("codeInput").addEventListener("keydown", (e) => { if (e.key === "Enter") $("codeButton").click(); });

async function api(path, options = {}) {
  const response = await fetch("/api/" + path, {
    ...options,
    headers: { "X-Pairing-Code": code, ...(options.headers || {}) },
  });
  let body = null;
  try { body = await response.json(); } catch (_) { /* empty body */ }
  if (response.status === 401 || response.status === 429) {
    showPairing(body && body.error);
    throw new Error("unauthorized");
  }
  return { status: response.status, ok: response.ok, body };
}

// --- browsing ---
async function start() {
  if (!code) { showPairing(); return; }
  let info;
  try { info = await api("info"); } catch (_) { return; }
  $("pairing").classList.add("hidden");
  $("app").classList.remove("hidden");
  $("device").textContent = info.body.device;
  roots = info.body.roots;
  renderRoots();
  refreshRemote();
  loadAddons();
  loadTmdb();
  loadSubtitles();
  loadNetwork();
  if (!current && roots.length) openFolder(roots[0], roots[0].path);
}

function renderRoots() {
  const box = $("roots");
  box.replaceChildren(...roots.map((root) => el("button", {
    class: "root" + (current && current.root.path === root.path ? " active" : ""),
    onclick: () => openFolder(root, root.path),
  }, root.kind === "library" ? "🎬 " + root.name : "💾 " + root.name, el("small", {}, t("free", formatBytes(root.freeBytes))))));
}

async function openFolder(root, path) {
  current = { root, path };
  renderRoots();
  const result = await api("list?" + query({ dir: path }));
  if (!result.ok) { $("listing").replaceChildren(el("li", { class: "error" }, result.body ? result.body.error : t("error"))); return; }
  const listing = result.body;
  $("free").textContent = t("freeOnDrive", formatBytes(listing.freeBytes));
  $("targetName").textContent = displayPath(path);
  renderCrumbs(root, path);
  const partials = new Map(listing.partials.map((p) => [p.name, p.received]));
  // Library folders (e.g. Filmek) are protected on the TV as well; don't offer what would be refused.
  const libraryPaths = new Set(roots.filter((r) => r.kind === "library").map((r) => r.path));
  $("listing").replaceChildren(
    ...listing.dirs.map((name) => el("li", { class: "dir", onclick: () => openFolder(root, path + "/" + name) },
      "📁", el("span", { class: "name" }, name),
      libraryPaths.has(path + "/" + name) ? el("span", { class: "size" }, t("library")) : deleteButton(name))),
    ...listing.partials.map((p) => el("li", {}, "⏸", el("span", { class: "name muted" }, p.name),
      el("span", { class: "size" }, t("partial", formatBytes(p.received))),
      el("button", { class: "small danger", onclick: () => discardPartial(p) }, t("discard")))),
    ...listing.files.map((f) => el("li", {}, "🎞", el("span", { class: "name" }, f.name),
      el("span", { class: "size" }, formatBytes(f.size)), deleteButton(f.name))),
  );
  if (!listing.dirs.length && !listing.files.length && !partials.size) {
    $("listing").replaceChildren(el("li", { class: "muted" }, t("emptyFolder")));
  }
}

function deleteButton(name) {
  return el("button", {
    class: "small danger",
    title: t("delete"),
    onclick: (e) => { e.stopPropagation(); removeEntry(name); },
  }, t("delete"));
}

/** Permanent delete: Android has no recycle bin, so always show exactly what goes and ask first. */
async function removeEntry(name) {
  const where = { dir: current.path, name };
  const stat = await api("stat?" + query(where));
  if (!stat.ok) { alert(stat.body ? stat.body.error : t("cannotDelete")); return; }
  const p = stat.body;
  const question = p.isDirectory
    ? t("confirmDeleteFolder", p.files, formatBytes(p.bytes), name)
    : t("confirmDeleteFile", formatBytes(p.bytes), name);
  if (!confirm(question)) return;
  const result = await api("delete?" + query(where), { method: "POST" });
  if (!result.ok) alert(result.body ? result.body.error : t("deleteFailed"));
  refreshRoots();
  openFolder(current.root, current.path);
}

async function discardPartial(partial) {
  if (!confirm(t("confirmDiscard", partial.name, formatBytes(partial.received)))) return;
  await api("upload?" + query({ dir: current.path, rel: "", name: partial.name }), { method: "DELETE" });
  openFolder(current.root, current.path);
}

/** Free space changes after uploads and deletes. */
async function refreshRoots() {
  try {
    const info = await api("info");
    roots = info.body.roots;
    if (current) current.root = roots.find((r) => r.path === current.root.path) || current.root;
    renderRoots();
  } catch (_) { /* keep the old numbers */ }
}

function displayPath(path) {
  const root = current.root;
  const rel = path.slice(root.path.length).replace(/^\//, "");
  return root.name + (rel ? " / " + rel.split("/").join(" / ") : "");
}

function renderCrumbs(root, path) {
  const rel = path.slice(root.path.length).split("/").filter(Boolean);
  const crumbs = [el("button", { onclick: () => openFolder(root, root.path) }, root.name)];
  rel.forEach((part, i) => {
    const target = root.path + "/" + rel.slice(0, i + 1).join("/");
    crumbs.push(el("span", { class: "muted" }, "›"), el("button", { onclick: () => openFolder(root, target) }, part));
  });
  $("crumbs").replaceChildren(...crumbs);
}

$("mkdirButton").addEventListener("click", async () => {
  const name = prompt(t("newFolderName"));
  if (!name || !current) return;
  const result = await api("mkdir?" + query({ dir: current.path, name: name.trim() }), { method: "POST" });
  if (!result.ok) { alert(result.body ? result.body.error : t("createFailed")); return; }
  openFolder(current.root, current.path + "/" + result.body.name);
});

// --- queue ---
/** Accepts File objects (pickers) or { file, rel } pairs (dropped folders). */
function enqueue(files) {
  if (!current) return;
  for (const entry of files) {
    const file = entry instanceof File ? entry : entry.file;
    if (SKIP_FILES.has(file.name)) continue;
    const relPath = file.webkitRelativePath || "";
    const rel = entry instanceof File
      ? (relPath.includes("/") ? relPath.slice(0, relPath.lastIndexOf("/")) : "")
      : entry.rel;
    queue.push({
      file, name: file.name, rel, dir: current.path, size: file.size, sent: 0, status: "queued",
      error: "", paused: false, xhr: null, speed: 0, sample: null,
    });
  }
  renderQueue();
  runQueue();
}

$("fileInput").addEventListener("change", (e) => { enqueue(e.target.files); e.target.value = ""; });
$("folderInput").addEventListener("change", (e) => { enqueue(e.target.files); e.target.value = ""; });
const drop = $("drop");
drop.addEventListener("dragover", (e) => { e.preventDefault(); drop.classList.add("over"); });
drop.addEventListener("dragleave", () => drop.classList.remove("over"));
drop.addEventListener("drop", async (e) => {
  e.preventDefault();
  drop.classList.remove("over");
  // A dropped folder arrives in dataTransfer.files as a single empty "file" named like the folder;
  // walk the entries instead so folders keep their structure. Entries must be taken synchronously.
  const entries = [...e.dataTransfer.items]
    .map((item) => item.webkitGetAsEntry && item.webkitGetAsEntry())
    .filter(Boolean);
  if (!entries.length) { enqueue(e.dataTransfer.files); return; }
  const found = [];
  try {
    for (const entry of entries) await walkEntry(entry, "", found);
  } catch (err) {
    alert(t("readFolderFailed", err));
    return;
  }
  enqueue(found);
});

async function walkEntry(entry, parent, out) {
  if (entry.isFile) {
    const file = await new Promise((resolve, reject) => entry.file(resolve, reject));
    out.push({ file, rel: parent });
  } else if (entry.isDirectory) {
    const path = parent ? parent + "/" + entry.name : entry.name;
    const reader = entry.createReader();
    // readEntries returns at most ~100 entries per call; keep reading until it returns none.
    for (;;) {
      const batch = await new Promise((resolve, reject) => reader.readEntries(resolve, reject));
      if (!batch.length) break;
      for (const child of batch) await walkEntry(child, path, out);
    }
  }
}
$("clearDone").addEventListener("click", () => {
  for (let i = queue.length - 1; i >= 0; i--) if (["done", "exists"].includes(queue[i].status)) queue.splice(i, 1);
  renderQueue();
});

async function runQueue() {
  if (running) return;
  running = true;
  try {
    let next;
    while ((next = queue.find((item) => item.status === "queued"))) {
      await upload(next);
      renderQueue();
    }
  } finally {
    running = false;
  }
  refreshRoots();
  if (current) openFolder(current.root, current.path);
}

function params(item, extra = {}) {
  return query({ dir: item.dir, rel: item.rel, name: item.name, ...extra });
}

async function upload(item) {
  item.status = "uploading";
  item.error = "";
  renderQueue();
  let status;
  try { status = await api("upload/status?" + params(item)); } catch (_) { item.status = "error"; return; }
  if (!status.ok) { fail(item, status.body && status.body.error); return; }
  if (status.body.exists) { item.status = "exists"; return; }
  let offset = status.body.received;
  item.sent = offset;
  let failures = 0;

  while (true) {
    if (item.paused) { item.status = "paused"; return; }
    const end = Math.min(offset + CHUNK, item.size);
    let result = null;
    try { result = await putChunk(item, offset, end); } catch (_) { /* network error or abort */ }
    if (item.paused) { item.status = "paused"; return; }

    if (result && result.status === 200) {
      failures = 0;
      offset = result.body.received;
      item.sent = offset;
      if (result.body.done) { item.status = "done"; item.sent = item.size; return; }
      continue;
    }
    if (result && result.status === 409) {
      if (result.body && result.body.received != null) { offset = result.body.received; item.sent = offset; continue; }
      item.status = "exists";
      return;
    }
    if (result && result.status === 401) { item.status = "queued"; showPairing(t("pairAgain")); return; }
    if (result && [400, 403, 507].includes(result.status)) { fail(item, result.body && result.body.error); return; }

    // Network trouble (Wi-Fi hiccup, TV busy): back off, then ask the TV where to continue.
    if (++failures > 8) { fail(item, t("connectionLost")); return; }
    item.status = "retrying";
    renderQueue();
    await sleep(Math.min(30000, 1000 * 2 ** failures));
    try {
      const again = await api("upload/status?" + params(item));
      if (again.ok) { offset = again.body.received; item.sent = offset; }
    } catch (_) { /* keep trying */ }
    item.status = "uploading";
  }
}

function fail(item, message) {
  item.status = "error";
  item.error = message || t("unknownError");
}

function putChunk(item, offset, end) {
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    item.xhr = xhr;
    xhr.open("PUT", "/api/upload?" + params(item, { offset, total: item.size }));
    xhr.setRequestHeader("X-Pairing-Code", code);
    xhr.setRequestHeader("Content-Type", "application/octet-stream");
    xhr.upload.onprogress = (e) => { item.sent = offset + e.loaded; measure(item); renderProgress(item); };
    xhr.onload = () => {
      let body = null;
      try { body = JSON.parse(xhr.responseText); } catch (_) { /* not json */ }
      resolve({ status: xhr.status, body });
    };
    xhr.onerror = () => reject(new Error("network"));
    xhr.onabort = () => reject(new Error("abort"));
    xhr.send(item.file.slice(offset, end));
  });
}

function measure(item) {
  const now = performance.now();
  if (!item.sample) { item.sample = { t: now, bytes: item.sent }; return; }
  const dt = (now - item.sample.t) / 1000;
  if (dt < 1) return;
  const instant = (item.sent - item.sample.bytes) / dt;
  item.speed = item.speed ? item.speed * 0.7 + instant * 0.3 : instant;
  item.sample = { t: now, bytes: item.sent };
}

function pause(item) { item.paused = true; if (item.xhr) item.xhr.abort(); renderQueue(); }
function resume(item) { item.paused = false; item.status = "queued"; item.sample = null; renderQueue(); runQueue(); }
async function cancel(item) {
  item.paused = true;
  if (item.xhr) item.xhr.abort();
  queue.splice(queue.indexOf(item), 1);
  try { await api("upload?" + params(item), { method: "DELETE" }); } catch (_) { /* ignore */ }
  renderQueue();
  refreshRoots();
  if (current) openFolder(current.root, current.path);
}

function renderQueue() {
  $("queueSection").classList.toggle("hidden", queue.length === 0);
  $("queue").replaceChildren(...queue.map((item) => {
    const actions = [];
    if (["uploading", "retrying", "queued"].includes(item.status)) actions.push(el("button", { class: "small", onclick: () => pause(item) }, t("pause")));
    if (["paused", "error"].includes(item.status)) actions.push(el("button", { class: "small", onclick: () => resume(item) }, t("resume")));
    if (!["done", "exists"].includes(item.status)) actions.push(el("button", { class: "small", onclick: () => cancel(item) }, t("cancel")));
    item.node = el("div", { class: "item" + (item.status === "done" ? " done" : item.status === "error" ? " failed" : "") },
      el("div", { class: "top" }, el("span", { class: "title" }, (item.rel ? item.rel + "/" : "") + item.name), ...actions),
      el("div", { class: "bar" }, el("div")),
      el("div", { class: "meta" }));
    renderProgress(item);
    return item.node;
  }));
  const total = queue.reduce((sum, i) => sum + i.size, 0);
  const sent = queue.reduce((sum, i) => sum + i.sent, 0);
  $("queueSummary").textContent = queue.length ? formatBytes(sent) + " / " + formatBytes(total) : "";
}

function renderProgress(item) {
  if (!item.node) return;
  const fraction = item.size ? item.sent / item.size : (item.status === "done" ? 1 : 0);
  item.node.querySelector(".bar > div").style.width = (fraction * 100).toFixed(1) + "%";
  const parts = [formatBytes(item.sent) + " / " + formatBytes(item.size), t("status_" + item.status)];
  if (item.status === "uploading" && item.speed > 0) {
    parts.push(formatBytes(item.speed) + "/s");
    const eta = formatEta((item.size - item.sent) / item.speed);
    if (eta) parts.push(t("eta", eta));
  }
  if (item.error) parts.push(item.error);
  item.node.querySelector(".meta").textContent = parts.join(" · ");
}

// --- remote ---
function formatTime(ms) {
  const total = Math.floor(ms / 1000), h = Math.floor(total / 3600), m = Math.floor(total % 3600 / 60), sec = total % 60;
  const two = (n) => String(n).padStart(2, "0");
  return h ? h + ":" + two(m) + ":" + two(sec) : m + ":" + two(sec);
}

function showRemote(status) {
  const box = $("nowPlaying");
  if (!status.inFront) { box.textContent = t("notInFront"); return; }
  if (!status.title) { box.textContent = t("nothingPlaying"); return; }
  const time = status.durationMs ? formatTime(status.positionMs || 0) + " / " + formatTime(status.durationMs) : "";
  box.replaceChildren(el("b", {}, (status.playing ? "▶ " : "⏸ ") + status.title), [status.subtitle, time].filter(Boolean).join(" · "));
}

async function refreshRemote() {
  try {
    const result = await api("remote");
    if (result.ok) showRemote(result.body);
  } catch (_) { /* pairing shown */ }
}

async function remote(path, options) {
  let result;
  try { result = await api(path, options); } catch (_) { return; }
  $("remoteError").textContent = result.ok ? "" : (result.body ? result.body.error : t("failed"));
  if (result.ok) showRemote(result.body);
}

const pressKey = (key) => remote("remote/key?" + query({ k: key }), { method: "POST" });
for (const button of document.querySelectorAll("[data-key]")) button.addEventListener("click", () => pressKey(button.dataset.key));

function sendSearch() {
  const text = $("remoteSearch").value.trim();
  if (!text) return;
  remote("remote/search", { method: "POST", headers: { "Content-Type": "text/plain" }, body: text });
}
$("remoteSearchButton").addEventListener("click", sendSearch);
$("remoteSearch").addEventListener("keydown", (e) => { if (e.key === "Enter") sendSearch(); });

// A computer keyboard works as the remote while no text field is in use.
const KEYS = { ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right", Enter: "ok", Backspace: "back", " ": "play_pause" };
document.addEventListener("keydown", (e) => {
  if ($("app").classList.contains("hidden") || e.target.closest("input, textarea, select")) return;
  // Enter and Space on a focused button already click it.
  if (e.target.closest("button, label") && (e.key === "Enter" || e.key === " ")) return;
  const key = KEYS[e.key];
  if (!key) return;
  e.preventDefault();
  pressKey(key);
});

// The playing line follows the TV while the page is visible.
setInterval(() => { if (!document.hidden && !$("app").classList.contains("hidden")) refreshRemote(); }, 3000);

// --- add-ons ---
async function loadAddons() {
  let result;
  try { result = await api("addons"); } catch (_) { return; }
  const list = result.ok ? result.body : [];
  $("addonList").replaceChildren(...(list.length ? list.map((a) => el("li", {},
    "🧩", el("span", { class: "name" }, a.name + " ", el("span", { class: "muted" }, "v" + a.version + " · " + a.id)),
    el("span", { class: "size" }, t(a.channels === 1 ? "channel" : "channels", a.channels)),
    el("button", { class: "small danger", onclick: () => removeAddon(a) }, t("remove")))) : [el("li", { class: "muted" }, t("noAddons"))]));
}

function showAddonResult(result) {
  $("addonError").textContent = result.ok ? "" : (result.body ? result.body.error : t("failed"));
  if (result.ok) loadAddons();
}

$("addonFile").addEventListener("change", async (e) => {
  const file = e.target.files[0];
  e.target.value = "";
  if (!file) return;
  const text = await file.text();
  showAddonResult(await api("addons", { method: "POST", headers: { "Content-Type": "application/json" }, body: text }));
});

$("addonUrlButton").addEventListener("click", async () => {
  const url = $("addonUrl").value.trim();
  if (!url) return;
  const result = await api("addons/url?" + query({ url }), { method: "POST" });
  if (result.ok) $("addonUrl").value = "";
  showAddonResult(result);
});

async function removeAddon(addon) {
  if (!confirm(t("confirmRemoveAddon", addon.name))) return;
  showAddonResult(await api("addons?" + query({ id: addon.id }), { method: "DELETE" }));
}


// --- network folders ---
async function loadNetwork() {
  let result;
  try { result = await api("network"); } catch (_) { return; }
  const list = result.ok ? result.body : [];
  $("networkList").replaceChildren(...(list.length ? list.map((f) => el("li", {},
    "🖧", el("span", { class: "name" }, f.root + " ", el("span", { class: "muted" }, "· " + (f.username || t("guest")))),
    el("span", { class: "size" }, t(f.items === 1 ? "video" : "videos", f.items)),
    el("button", { class: "small danger", onclick: () => removeNetwork(f) }, t("remove")))) : [el("li", { class: "muted" }, t("noNetworkFolders"))]));
}

$("netAdd").addEventListener("click", async () => {
  const request = {
    host: $("netHost").value.trim(), share: $("netShare").value.trim(), path: $("netPath").value.trim(),
    username: $("netUser").value.trim(), password: $("netPassword").value,
  };
  if (!request.host || !request.share) { $("netError").textContent = t("needHostAndShare"); return; }
  $("netAdd").disabled = true;
  $("netError").textContent = t("connecting");
  try {
    const result = await api("network", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(request) });
    if (result.ok) {
      $("netError").textContent = "";
      $("netPassword").value = "";
      $("netPath").value = "";
      loadNetwork();
    } else {
      $("netError").textContent = result.body ? result.body.error : t("failed");
    }
  } finally { $("netAdd").disabled = false; }
});

async function removeNetwork(folder) {
  if (!confirm(t("confirmRemoveNetwork", folder.root))) return;
  const result = await api("network?" + query({ root: folder.root }), { method: "DELETE" });
  $("netError").textContent = result.ok ? "" : (result.body ? result.body.error : t("failed"));
  loadNetwork();
}

// --- TMDB token ---
async function loadTmdb(result) {
  if (!result) { try { result = await api("tmdb"); } catch (_) { return; } }
  if (!result.ok) return;
  const s = result.body;
  $("tmdbStatus").textContent = !s.configured ? t("tmdbNone") : s.source === "user" ? t("tmdbUser") : t("tmdbBuiltIn");
  $("tmdbClear").classList.toggle("hidden", s.source !== "user");
}

$("tmdbSave").addEventListener("click", async () => {
  const token = $("tmdbToken").value.trim();
  if (!token) return;
  $("tmdbSave").disabled = true;
  $("tmdbError").textContent = "";
  try {
    const result = await api("tmdb", { method: "POST", headers: { "Content-Type": "text/plain" }, body: token });
    if (result.ok) { $("tmdbToken").value = ""; loadTmdb(result); }
    else $("tmdbError").textContent = result.body ? result.body.error : t("failed");
  } finally { $("tmdbSave").disabled = false; }
});

$("tmdbClear").addEventListener("click", async () => {
  if (!confirm(t("confirmClearTmdb"))) return;
  loadTmdb(await api("tmdb", { method: "DELETE" }));
});

// --- OpenSubtitles ---
let subsConfigured = false;
function showSubtitles(status) {
  subsConfigured = status.configured;
  $("subsStatus").textContent = !status.configured ? t("subsNone") : status.username ? t("subsSetUser", status.username) : t("subsSet");
  $("subsClear").classList.toggle("hidden", !status.configured);
}

async function loadSubtitles() {
  try {
    const result = await api("subtitles");
    if (result.ok) showSubtitles(result.body);
  } catch (_) { /* pairing shown */ }
}

$("subsSave").addEventListener("click", async () => {
  const request = { apiKey: $("subsKey").value.trim(), username: $("subsUser").value.trim(), password: $("subsPassword").value };
  if (!request.apiKey && !subsConfigured) return;
  $("subsSave").disabled = true;
  $("subsError").textContent = t("connecting");
  try {
    const result = await api("subtitles", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(request) });
    if (result.ok) {
      $("subsError").textContent = "";
      $("subsKey").value = ""; $("subsPassword").value = "";
      showSubtitles(result.body);
    } else {
      $("subsError").textContent = result.body ? result.body.error : t("failed");
    }
  } finally { $("subsSave").disabled = false; }
});

$("subsClear").addEventListener("click", async () => {
  if (!confirm(t("confirmClearSubs"))) return;
  const result = await api("subtitles", { method: "DELETE" });
  if (result.ok) showSubtitles(result.body);
});

window.addEventListener("beforeunload", (e) => {
  if (queue.some((i) => ["uploading", "retrying", "queued"].includes(i.status))) { e.preventDefault(); e.returnValue = ""; }
});

start();
</script>
</body>
</html>
